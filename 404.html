<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Eren Malkoç</title>
    <meta name="description" content="This page does not exist." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)" />

    <!-- Absolute paths, not relative: this page is served for a miss at any
         depth (/a/b/c), and relative hrefs would resolve against that path
         and 404 in turn, leaving the page unstyled. -->
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Press+Start+2P&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main">
      <section class="hero">
        <div class="hero__glow" aria-hidden="true"></div>
        <span class="wordmark">erenium</span>

        <div class="wrap">
          <h1 class="hello">404</h1>

          <p class="notfound__text swap">
            <span class="swap__word" lang="tr">Sayfa bulunamadı</span>
            <span class="swap__word" lang="en">Page not found</span>
            <span class="swap__word" lang="es">Página no encontrada</span>
            <span class="swap__word" lang="fr">Page introuvable</span>
            <span class="swap__word" lang="de">Seite nicht gefunden</span>
          </p>

          <div class="notfound__actions">
            <a class="btn btn--filled" href="/">
              <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
              Back to erenium.tech
            </a>
          </div>
        </div>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
